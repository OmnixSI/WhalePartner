name: 缺陷
description: 记录可复现的问题
title: "[Bug] "
labels: []
body:
  - type: textarea
    id: observed
    attributes:
      label: 实际结果
      description: 发生了什么？
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 环境与日志
      description: 提供相关系统、版本和必要日志，不要粘贴密钥。
    validations:
      required: false
